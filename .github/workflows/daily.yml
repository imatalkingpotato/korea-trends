name: Korea Trends Daily

on:
  schedule:
    - cron: '0 2 * * 1-5'   # 월~금 한국시간 오전 11시
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: python korea_trends.py

      - name: Save updated trends list
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add previous_trends.json
          git diff --staged --quiet || git commit -m "update previous_trends.json"
          git push
